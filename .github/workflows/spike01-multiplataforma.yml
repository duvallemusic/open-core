# Spike 01 — build multiplataforma (Níveis A/B)

# Estratégia:
# - macOS ARM64: desenvolvimento local + runner macos-latest
# - Linux x64 / Windows x64: build nativo nos runners (não cross-compile a partir do Mac)
# - Nível C (smoke GUI nativo) permanece manual — ver EVIDENCIAS.md

name: spike01-multiplataforma

on:
  push:
    paths:
      - "spikes/01-multiplataforma/**"
      - ".github/workflows/spike01-multiplataforma.yml"
  pull_request:
    paths:
      - "spikes/01-multiplataforma/**"
      - ".github/workflows/spike01-multiplataforma.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: spikes/01-multiplataforma

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências Linux (Slint / winit X11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libfontconfig-dev \
            libssl-dev

      - name: Instalar Rust estável
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/01-multiplataforma -> target

      - name: cargo check
        run: cargo check

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

      - name: Metadados do artefato
        shell: bash
        run: |
          set -euo pipefail
          BIN="spike01-multiplataforma"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN="spike01-multiplataforma.exe"
          fi
          SRC="target/release/${BIN}"
          DEST="${RUNNER_TEMP}/spike01-${{ matrix.os }}"
          mkdir -p "${DEST}"
          cp "${SRC}" "${DEST}/"
          (
            echo "os=${{ matrix.os }}"
            echo "runner_os=${{ runner.os }}"
            echo "runner_arch=${{ runner.arch }}"
            rustc --version
            cargo --version
            ls -la "${DEST}/${BIN}"
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "${DEST}/${BIN}"
            elif command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${DEST}/${BIN}"
            fi
          ) | tee "${DEST}/BUILD_INFO.txt"

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: spike01-${{ matrix.os }}
          path: ${{ runner.temp }}/spike01-${{ matrix.os }}/
          if-no-files-found: error
          retention-days: 14
